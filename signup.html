<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===== HEAD SECTION: Meta tags & Bootstrap 5 CDN ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign-up </title>

    <!-- Bootstrap 5 CSS from CDN. No local files needed. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Soft multi-color gradient background — no flat/singular color */
        .bg-custom {
            background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 50%, #e0f2fe 100%);
        }

        /* Decorative blurred circles behind the card */
        .circle {
            position: absolute;   /* float freely, positioned relative to body */
            border-radius: 50%;   /* make them circles */
            filter: blur(60px);   /* soft glow effect instead of hard edges */
            opacity: 0.6;
            z-index: 0;           /* stay BEHIND the card */
            pointer-events: none; /* never block clicks */
        }

        /* Individual circle sizes, colors, and positions */
        .circle-1 { width: 350px; height: 350px; background: #a5b4fc; top: -80px;  left: -80px; }
        .circle-2 { width: 300px; height: 300px; background: #f9a8d4; bottom: -60px; right: -60px; }
        .circle-3 { width: 200px; height: 200px; background: #7dd3fc; top: 55%;    left: 12%; }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-custom position-relative overflow-hidden">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <div class="card shadow border-primary z-1 position-relative" style="width: 100%; max-width: 400px;">

        <div class="card-body p-4 p-md-5">
            <!-- p-4 = padding 1.5rem on small screens, p-md-5 = 3rem on medium+ screens -->

            <!-- ===== HEADER ===== -->
            <div class="text-center mb-4">
                <h3 class="fw-bold">PT. Jaya Group Pengadaan</h3>
                <p class="text-muted mb-0">Sign up</p>
            </div>
            <!-- text-center -> center align | mb-4 -> margin-bottom
                 text-muted  -> gray secondary text | mb-0 -> remove bottom margin -->

            <!-- ===== LOGIN FORM ===== -->
            <form>
                <!-- Username field -->
                <div class="mb-3">
                    <label for="name" class="form-label">Username</label>
                    <input type="name" class="form-control" id="name"
                           placeholder="Username" required>
                </div>

                <!-- form-label / form-control -> Bootstrap form styling -->

                <!-- Password field + "Forgot password" link on the same line -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <input type="password" class="form-control" id="password"
                           placeholder="Enter password" required>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label for="repassword" class="form-label">Re-enter Password</label>
                    </div>
                    <input type="repassword" class="form-control" id="password"
                           placeholder="Re-Enter password" required>
                </div>

                <!-- Submit button: stretched full width -->
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (only needed if you use components like modals/dropdowns;
         harmless to include for a login page) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
